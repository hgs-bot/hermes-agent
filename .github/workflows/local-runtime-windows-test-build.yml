name: Local runtime Windows test build

on:
  push:
    branches:
      - "feature/native-local-runtime"

permissions:
  contents: read

concurrency:
  group: local-runtime-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify installer frontend and smoke contract
        working-directory: apps/bootstrap-installer
        run: |
          npm run check
          npm test
          npm run build

      - name: Verify native E2E smoke runner
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/bootstrap-installer/smoke/windows-local-runtime-e2e.ps1 -SelfTest

      - name: Verify Rust installer on native Windows
        working-directory: apps/bootstrap-installer/src-tauri
        run: cargo test --lib

      - name: Build commit-pinned NSIS installer
        working-directory: apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ github.sha }}
          HERMES_BUILD_PIN_BRANCH: feature/native-local-runtime
        run: npm run tauri:build -- --bundles nsis

      - name: Publish installer and native smoke kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-local-runtime-windows-${{ github.sha }}
          path: |
            apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe
            apps/bootstrap-installer/smoke/windows-local-runtime-smoke.ps1
            apps/bootstrap-installer/smoke/README.md
          if-no-files-found: error
          retention-days: 14
